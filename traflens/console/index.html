<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TrafLens · 请求探索</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f4f6fa;color:#172332;font:14px system-ui}header{background:#142d3b;color:white;padding:22px 5%;display:flex;justify-content:space-between}header b{font-size:22px;letter-spacing:1px}main{max-width:1400px;margin:30px auto;padding:0 24px}section{background:white;border:1px solid #dde4e9;border-radius:10px;padding:22px;margin:18px 0}h1{font-size:26px;margin:0}h2{font-size:17px}p,.muted{color:#637381}form{display:flex;gap:12px;align-items:end;flex-wrap:wrap}label{display:grid;gap:6px}input,select,button{font:inherit;border:1px solid #c6d1d9;border-radius:5px;padding:10px}button{background:#087d76;color:white;border:0;cursor:pointer}button:disabled{opacity:.5}table{border-collapse:collapse;width:100%;text-align:left}th,td{padding:12px;border-bottom:1px solid #e6ebef;max-width:500px;overflow-wrap:anywhere}th{color:#607483;font-weight:500}td button{background:#edf8f7;color:#08766e}#error{color:#a92a2a}dialog{border:1px solid #c8d3d8;border-radius:12px;max-width:850px;width:90%;max-height:90vh;overflow:auto}dl{display:grid;grid-template-columns:180px 1fr;gap:10px}dd{margin:0;overflow-wrap:anywhere}.scroll{overflow:auto}.badge{font-size:12px;background:#244656;padding:7px;border-radius:5px}</style>
<header><b>TrafLens</b><span class="badge">真实数据 · 请求探索</span></header><main><h1>请求探索</h1><p>从采集记录中检索请求，查看响应与观测来源。</p><section><h2>检索条件</h2><form id="filters"><label>开始时间<input id="from" type="datetime-local" required></label><label>结束时间<input id="to" type="datetime-local" required></label><label>请求资源包含<input id="q" placeholder="例如 /api/orders" maxlength="200"></label><label>应用协议<select id="proto"><option value="">全部协议</option></select></label><button id="submit">查询请求</button></form><p class="muted">显示选定时间范围内最新 100 条；时间跨度最多 31 天。</p><p id="error" role="alert"></p></section><section><h2>流量概览</h2><p id="overviewStatus" role="status">正在获取…</p><p>符合筛选条件的请求记录：<strong id="total">—</strong></p><div id="protocols"></div><p class="muted">按采集记录统计，协议分组最多显示 32 项；点击分组查看请求。</p></section><section><h2>请求记录 <small id="count"></small></h2><p id="status" role="status">尚未查询</p><div class="scroll"><table><thead><tr><th>时间</th><th>方法</th><th>请求资源</th><th>响应码</th><th>协议编号</th><th>详情</th></tr></thead><tbody id="rows"></tbody></table></div></section><section><h2>Agent 状态</h2><p id="agents">正在获取…</p></section></main><dialog id="detail"><button id="close">关闭</button><h2>请求详情</h2><p id="detailStatus"></p><dl id="fields"></dl></dialog>
<script>
const $=id=>document.getElementById(id);
const local=d=>new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,16);
$('from').value=local(new Date(Date.now()-86400000));$('to').value=local(new Date());
let current='',generation=0;
async function get(path){const r=await fetch(path);const d=await r.json();if(!r.ok)throw Error(d.error||'查询失败');return d}
function objects(d){return (d.values||[]).map(row=>Object.fromEntries(d.columns.map((k,i)=>[k,row[i]])))}
async function show(id){
 $('detail').showModal();$('fields').replaceChildren();$('detailStatus').textContent='正在加载…';
 try{const p=new URLSearchParams(current);p.set('id',id);p.delete('q');const rows=objects(await get('/api/requests?'+p));
 if(!rows.length){$('detailStatus').textContent='未找到该请求，记录可能已过期。';return}
 $('detailStatus').textContent='来自实际采集记录';
 for(const [key,value] of Object.entries(rows[0])){const dt=document.createElement('dt'),dd=document.createElement('dd');dt.textContent=key;dd.textContent=value==null?'—':String(value);$('fields').append(dt,dd)}
 }catch(e){$('detailStatus').textContent=e.message}
}
$('close').onclick=()=>$('detail').close();
async function overview(params,turn){
 try{const d=await get('/api/overview?'+params);if(turn!==generation)return;
 const totals=objects(d.total);$('total').textContent=totals.length?String(totals[0].requests):'0';
 $('overviewStatus').textContent='统计范围与下方请求筛选一致';$('protocols').replaceChildren();
 for(const row of objects(d.protocols)){
 const code=String(row.l7_protocol),label=(code==='20'?'HTTP':'协议 '+code);
 if(!Array.from($('proto').options).some(x=>x.value===code)){const o=document.createElement('option');o.value=code;o.textContent=label;$('proto').append(o)}
 const b=document.createElement('button');b.textContent=label+' · '+row.requests+' 条';b.style.marginRight='10px';b.onclick=()=>{$('proto').value=code;$('filters').requestSubmit()};$('protocols').append(b)
 }
 }catch(e){if(turn===generation){$('overviewStatus').textContent='概览不可用：'+e.message;$('total').textContent='—';$('protocols').replaceChildren()}}
}
$('filters').onsubmit=async e=>{
 e.preventDefault();const turn=++generation;$('submit').disabled=true;$('error').textContent='';$('status').textContent='正在查询…';$('rows').replaceChildren();$('count').textContent='';$('overviewStatus').textContent='正在统计…';$('total').textContent='—';$('protocols').replaceChildren();
 const p=new URLSearchParams({from:Math.floor(new Date($('from').value).getTime()/1000),to:Math.floor(new Date($('to').value).getTime()/1000),q:$('q').value});if($('proto').value)p.set('proto',$('proto').value);current=p.toString();
 const stats=overview(current,turn);
 try{const rows=objects(await get('/api/requests?'+current));if(turn!==generation)return;
 $('status').textContent=rows.length?'点击详情查看完整返回字段。':'该范围内没有请求，请调整时间或筛选条件。';$('count').textContent='· '+rows.length+' 条';
 for(const row of rows){const tr=document.createElement('tr');for(const k of ['time','request_type','request_resource','response_code','l7_protocol']){const td=document.createElement('td');td.textContent=row[k]??'—';tr.append(td)}const td=document.createElement('td'),b=document.createElement('button');b.textContent='查看详情';b.onclick=()=>show(row.id);td.append(b);tr.append(td);$('rows').append(tr)}
 }catch(e){if(turn===generation){$('error').textContent=e.message;$('status').textContent='查询未完成。'}}
 finally{await stats;if(turn===generation)$('submit').disabled=false}
};
get('/api/agents').then(a=>{$('agents').textContent=a.length?a.map(x=>x.NAME+' · '+(x.ENABLE===1?'启用':'禁用')+' · 状态码 '+x.STATE).join('；'):'暂无已注册 Agent。'}).catch(e=>{$('agents').textContent='Agent 状态不可用：'+e.message});
$('filters').requestSubmit();
</script></html>
